services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
      POSTGRES_DB: transport
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d transport"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    env_file: server/.env
    environment:
      # Inside Docker the database host is the service name "db", not localhost.
      DATABASE_URL: postgresql://saas:saas@db:5432/transport?schema=public
      CLIENT_ORIGIN: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  pgdata:
